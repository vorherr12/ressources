<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SIMPA DGFiP - Simulateur de Paie</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:#0d1117;color:#e6edf3;font-size:13px;line-height:1.4}
        .app{display:grid;grid-template-columns:380px 1fr;height:100vh}
        .sidebar{background:#161b22;border-right:1px solid #30363d;overflow-y:auto;padding:16px}
        .main{overflow-y:auto;padding:20px}
        h1{font-size:15px;color:#58a6ff;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #30363d}
        h2{font-size:12px;color:#8b949e;margin:16px 0 8px;text-transform:uppercase;letter-spacing:0.5px}
        .form-group{margin-bottom:12px}
        .form-group label{display:block;margin-bottom:4px;color:#8b949e;font-size:11px}
        select,input[type="number"],input[type="text"]{width:100%;padding:6px 10px;font-size:13px;color:#e6edf3;background:#0d1117;border:1px solid #30363d;border-radius:4px}
        select:focus,input:focus{outline:none;border-color:#58a6ff}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
        .checkbox{display:flex;align-items:center;gap:6px;margin:8px 0}
        .checkbox input{width:auto}
        .checkbox label{color:#e6edf3;font-size:12px}
        table{width:100%;border-collapse:collapse;font-size:12px}
        th,td{padding:6px 10px;border:1px solid #30363d;text-align:right}
        th{background:#21262d;color:#8b949e;font-weight:600;text-align:center}
        td:first-child{text-align:left;color:#8b949e}
        .highlight td{background:rgba(46,160,67,0.15);color:#3fb950;font-weight:600}
        .negative{color:#f85149}
        .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
        .summary{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
        .summary-card{background:#21262d;border:1px solid #30363d;border-radius:6px;padding:10px;text-align:center}
        .summary-card .value{font-size:16px;font-weight:700;color:#3fb950;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
        .summary-card .label{font-size:10px;color:#8b949e;margin-top:4px}
        .info{background:rgba(56,139,253,0.1);border:1px solid #388bfd66;border-radius:4px;padding:8px 12px;margin-bottom:12px;font-size:11px;color:#58a6ff}
        .section{background:#161b22;border:1px solid #30363d;border-radius:6px;margin-bottom:16px}
        .section-header{background:#21262d;padding:10px 16px;border-bottom:1px solid #30363d;font-weight:600;font-size:12px;color:#8b949e}
        .section-body{padding:16px}
        .params-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        .input-addon{display:flex}
        .input-addon input{border-radius:4px 0 0 4px;border-right:0}
        .input-addon span{background:#21262d;border:1px solid #30363d;border-radius:0 4px 4px 0;padding:6px 10px;color:#8b949e;font-size:12px}
    </style>
</head>

        </div>

        </div>

        <h2>Options</h2>

            </div>
            <div class="form-group">
                <label>Participation PSC</label>
                <input type="number" id="psc" value="15" step="0.01" oninput="calc()">
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label>Mutuelle</label>
                <input type="number" id="mutuelle" value="93.76" step="0.01" oninput="calc()">
            </div>
            <div class="form-group">
                <label>Premuo</label>
                <input type="number" id="premuo" value="10.03" step="0.01" oninput="calc()">
            </div>
        </div>
        <div class="form-group">
            <label>Indemnité compensatrice CSG</label>
            <input type="number" id="iccsg" value="28.25" step="0.01" oninput="calc()">
        </div>
        <div class="form-group">
            <label>Taux PAS (%)</label>
            <div class="input-addon">
                <input type="number" id="pas" value="5.5" step="0.1" min="0" max="45" oninput="calc()">
                <span>%</span>
            </div>
        </div>
    </div>
    
    <div class="main">
        <div class="summary" id="summary"></div>
        
        <div class="section">
            <div class="section-header">Simulation par quotité de travail</div>
            <div class="section-body">
                <table id="results"></table>
            </div>
        </div>
    </div>
</div>

function init(){
    const gs = document.getElementById('grade');
    GRADES.forEach((g,i)=>{
        const o = document.createElement('option');
        o.value = i;
        o.textContent = `${g.id} — INM ${g.inm} — Cat. ${g.cat}`;
        gs.appendChild(o);
    });
    gs.value = 66; // CP 8
    
    const fs = document.getElementById('fonction');
    FONCTIONS.forEach((f,i)=>{
        const o = document.createElement('option');
        o.value = i;
        o.textContent = f.label;
        fs.appendChild(o);
    });
    fs.value = 14; // Programmeur après 2 ans 6 mois
    
    calc();
}

function fmt(n){return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})}

function calcSFT(inm, nb){
    if(nb===0) return 0;
    if(nb===1) return P.sft1;
    const tb = inm * P.ptIndice;
    const plancher = P.indicePlancherSFT * P.ptIndice;
    const plafond = P.indicePlafondSFT * P.ptIndice;
    const base = Math.min(Math.max(tb, plancher), plafond);
    if(nb===2) return P.sftFixe2 + base * P.sftProp2;
    if(nb===3) return P.sftFixe3 + base * P.sftProp3;
    return P.sftFixe3 + base * P.sftProp3 + (nb-3) * (P.sftFixeSupp + base * P.sftPropSupp);
}

function calc(){
    const g = GRADES[document.getElementById('grade').value];
    const bareme = document.getElementById('bareme').value;
    const residence = parseFloat(document.getElementById('residence').value)/100;
    const sftNb = parseInt(document.getElementById('sft').value);
    const nbi = parseInt(document.getElementById('nbi').value)||0;
    const fonction = FONCTIONS[document.getElementById('fonction').value];
    const surcot = document.getElementById('surcot').checked;
    const transport = parseFloat(document.getElementById('transport').value)||0;
    const psc = parseFloat(document.getElementById('psc').value)||0;
    const mutuelle = parseFloat(document.getElementById('mutuelle').value)||0;
    const premuo = parseFloat(document.getElementById('premuo').value)||0;
    const iccsg = parseFloat(document.getElementById('iccsg').value)||0;
    const tauxPAS = parseFloat(document.getElementById('pas').value)/100||0;
    
    const coefBareme = bareme==='reunion' ? P.coefReunion : 1;
    const prMajore = bareme==='idf' ? 1.05 : 1;
    
    const inm = g.inm;
    const traitBase = inm * P.ptIndice;
    const prAnnuel = g.pr * prMajore;
    const prMens = prAnnuel / 12;
    const iftsMens = g.ifts;
    const acfMens = g.acf / 12;
    const sft = calcSFT(inm, sftNb);
    const nbiMont = nbi * P.ptIndice;
    const indRes = Math.max(inm, P.indicePlancher) * P.ptIndice * residence;
    const primeInfo = fonction.prime;
    
    const rows = [
        {l:"Traitement brut",v:[]},
        {l:"Indemnité de résidence",v:[]},
        {l:"SFT",v:[]},
        {l:"NBI",v:[]},
        {l:"Indemnité compensatrice CSG",v:[]},
        {l:"Pension civile (11,10%)",v:[],neg:1},
        {l:"Surcotisation TP",v:[],neg:1},
        {l:"PC sur IMT (20%)",v:[],neg:1},
        {l:"IMT",v:[]},
        {l:"IFTS / IAT",v:[]},
        {l:"Prime de rendement",v:[]},
        {l:"ACF Technicité",v:[]},
        {l:"Prime fonction informatique",v:[]},
        {l:"Participation PSC",v:[]},
        {l:"Remboursement transport",v:[]},
        {l:"RAFP (5%)",v:[],neg:1},
        {l:"CSG déductible (6,80%)",v:[],neg:1},
        {l:"CSG non déductible (2,40%)",v:[],neg:1},
        {l:"CRDS (0,50%)",v:[],neg:1},
        {l:"Transfert primes/points",v:[],neg:1},
        {l:"Mutuelle",v:[],neg:1},
        {l:"Premuo",v:[],neg:1},
        {l:"Total brut",v:[],bold:1},
        {l:"Total retenues",v:[],neg:1},
        {l:"Net imposable",v:[],bold:1},
        {l:"Net avant PAS",v:[],bold:1},
        {l:"PAS",v:[],neg:1},
        {l:"Net après PAS",v:[],hl:1}
    ];
    
    const netApres = [];
    
    Q.forEach(qt=>{
        const q = qt.q;
        const r = qt.r;
        
        const trait = traitBase * r * coefBareme;
        const ir = indRes * r * coefBareme;
        const sftQ = sft * r;
        const nbiQ = nbiMont * r;
        const iccsgQ = iccsg * r;
        const pc = trait * P.pc;
        
        let surcotPC = 0;
        if(surcot && q < 1) surcotPC = traitBase * coefBareme * (1-q) * P.surcot;
        
        const imt = P.imt * r;
        const pcIMT = imt * P.pcIMT;
        const ifts = iftsMens * r;
        const pr = prMens * r;
        const acf = acfMens * r;
        const pInfo = primeInfo * r;
        const pscQ = psc;
        const transportQ = transport;
        
        const primes = ifts + pr + acf + pInfo;
        const assiettePrimes = Math.min(primes, trait * P.rafpAssiette);
        const rafp = assiettePrimes * P.rafpTaux;
        
        const totalBrut = trait + ir + sftQ + nbiQ + iccsgQ + imt + ifts + pr + acf + pInfo + pscQ + transportQ;
        const assietteCSG = (trait + ir + sftQ + nbiQ + imt + primes + pscQ) * P.assietteCSG;
        const csgDed = assietteCSG * P.csgDed;
        const csgNonDed = assietteCSG * P.csgNonDed;
        const crds = assietteCSG * P.crds;
        const transfert = primes * P.transfert;
        
        const totalRet = pc + surcotPC + pcIMT + rafp + csgDed + csgNonDed + crds + transfert + mutuelle + premuo;
        const netImposable = totalBrut - csgDed - pc - surcotPC - pcIMT - rafp - transfert;
        const netAvantPAS = totalBrut - totalRet;
        const pas = netImposable * tauxPAS;
        const netApresPAS = netAvantPAS - pas;
        
        netApres.push(netApresPAS);
        
        rows[0].v.push(trait);
        rows[1].v.push(ir);
        rows[2].v.push(sftQ);
        rows[3].v.push(nbiQ);
        rows[4].v.push(iccsgQ);
        rows[5].v.push(-pc);
        rows[6].v.push(-surcotPC);
        rows[7].v.push(-pcIMT);
        rows[8].v.push(imt);
        rows[9].v.push(ifts);
        rows[10].v.push(pr);
        rows[11].v.push(acf);
        rows[12].v.push(pInfo);
        rows[13].v.push(pscQ);
        rows[14].v.push(transportQ);
        rows[15].v.push(-rafp);
        rows[16].v.push(-csgDed);
        rows[17].v.push(-csgNonDed);
        rows[18].v.push(-crds);
        rows[19].v.push(-transfert);
        rows[20].v.push(-mutuelle);
        rows[21].v.push(-premuo);
        rows[22].v.push(totalBrut);
        rows[23].v.push(-totalRet);
        rows[24].v.push(netImposable);
        rows[25].v.push(netAvantPAS);
        rows[26].v.push(-pas);
        rows[27].v.push(netApresPAS);
    });
    
    // Summary
    let summaryHTML = '';
    Q.forEach((qt,i)=>{
        summaryHTML += `<div class="summary-card"><div class="value">${fmt(netApres[i])}</div><div class="label">Net ${qt.l}</div></div>`;
    });
    document.getElementById('summary').innerHTML = summaryHTML;
    
    // Table
    let html = '<tr><th>Élément</th>';
    Q.forEach(qt=>{ html += `<th>${qt.l}</th>`; });
    html += '</tr>';
    
    rows.forEach(row=>{
        const cls = row.hl ? 'highlight' : '';
        html += `<tr class="${cls}"><td>${row.l}</td>`;
        row.v.forEach(v=>{
            const val = Math.abs(v) < 0.01 ? '-' : fmt(v);
            const cellCls = v < 0 ? 'negative mono' : 'mono';
            html += `<td class="${cellCls}">${val}</td>`;
        });
        html += '</tr>';
    });
    
    document.getElementById('results').innerHTML = html;
}

init();
</script>
