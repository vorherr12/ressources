<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Simulateur Rachat CET</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            font-size: 14px;
            padding: 40px;
        }
        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 40px;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #8b949e;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #8b949e;
            font-size: 12px;
        }
        select, input {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            color: #e6edf3;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .input-row {
            display: grid;
            grid-template-columns: 1fr 50px;
            gap: 8px;
        }
        .unit {
            padding: 8px 0;
            text-align: center;
            color: #8b949e;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
        }
        .tmi-btns {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .tmi-btns button {
            flex: 1;
            padding: 6px;
            font-size: 12px;
            color: #8b949e;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 4px;
            cursor: pointer;
        }
        .tmi-btns button:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            background: #161b22;
            border: 1px solid #30363d;
            color: #8b949e;
            font-weight: 600;
            font-size: 12px;
        }
        td {
            padding: 12px 16px;
            border: 1px solid #30363d;
        }
        td:last-child {
            text-align: right;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        }
        tr.highlight {
            background: rgba(46,160,67,0.15);
        }
        tr.highlight td {
            color: #3fb950;
            font-weight: 600;
            border-color: #238636;
        }
        tr.danger td:last-child {
            color: #f85149;
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="params">
            <h1>Paramètres</h1>
            
            <div class="form-group">
                <label>Catégorie</label>
                <select id="categorie" onchange="calc()">
                    <option value="A">A — 150 €/jour</option>
                    <option value="B">B — 100 €/jour</option>
                    <option value="C">C — 83 €/jour</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Nombre de jours</label>
                <input type="number" id="jours" value="10" min="1" oninput="calc()">
            </div>
            
            <div class="form-group">
                <label>TMI</label>
                <div class="input-row">
                    <input type="number" id="tmi" value="30" min="0" max="45" oninput="calc()">
                    <div class="unit">%</div>
                </div>
                <div class="tmi-btns">
                    <button onclick="setTMI(0)">0</button>
                    <button onclick="setTMI(11)">11</button>
                    <button onclick="setTMI(30)">30</button>
                    <button onclick="setTMI(41)">41</button>
                    <button onclick="setTMI(45)">45</button>
                </div>
            </div>
        </div>
        
        <div class="result">
            <h1>Résultat</h1>
            <table>
                <tr>
                    <th>Libellé</th>
                    <th>Montant</th>
                </tr>
                <tr>
                    <td>Brut</td>
                    <td id="r-brut">-</td>
                </tr>
                <tr>
                    <td>Net (après cotisations)</td>
                    <td id="r-net">-</td>
                </tr>
                <tr class="danger">
                    <td>Impôt sur le revenu</td>
                    <td id="r-impot">-</td>
                </tr>
                <tr class="highlight">
                    <td>Super Net</td>
                    <td id="r-supernet">-</td>
                </tr>
            </table>
        </div>
    </div>

    <script>
        const data = {
            A: { brut: 150, net: 142.50 },
            B: { brut: 100, net: 95.00 },
            C: { brut: 83, net: 78.85 }
        };

        const fmt = n => n.toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €';

        function setTMI(v) {
            document.getElementById('tmi').value = v;
            calc();
        }

        function calc() {
            const cat = document.getElementById('categorie').value;
            const jours = parseInt(document.getElementById('jours').value) || 0;
            const tmi = parseFloat(document.getElementById('tmi').value) || 0;
            const d = data[cat];
            
            const brut = jours * d.brut;
            const net = jours * d.net;
            const impot = net * tmi / 100;
            const supernet = net - impot;
            
            document.getElementById('r-brut').textContent = fmt(brut);
            document.getElementById('r-net').textContent = fmt(net);
            document.getElementById('r-impot').textContent = '- ' + fmt(impot);
            document.getElementById('r-supernet').textContent = fmt(supernet);
        }

        calc();
    </script>
</body>
</html>
